name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate content and page registry
        run: npm run validate
      - name: Test
        run: npm test
      - name: Build with SEO artifacts
        run: npm run build
      - name: Verify generated SEO output
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/index.html
          test -s dist/about/index.html
          test -s dist/blog/index.html
          test -s dist/404.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'og:title' dist/about/index.html

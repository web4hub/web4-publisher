name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
